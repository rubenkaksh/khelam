name: khelam
description: "Reusable Flutter starter template following clean architecture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  commons:
    path: ../../commons
    # git:
    #   url: https://github.com/rubenkaksh/commons.git
    #   ref: v0.6.0
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^17.0.0
  get_it: ^9.2.1
  dio: ^5.9.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  intl: ^0.19.0
  material_3_demo:
    path: ../../flutter_material_3_demo
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^10.3.1
  samseer: ^0.1.0
  shared_preferences: ^2.5.3
  skeletonizer: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  mockito: ^5.4.5
  shared_preferences_platform_interface: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - .env
